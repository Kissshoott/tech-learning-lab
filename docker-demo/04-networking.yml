# ===== M4: 网络与容器通信演示 =====
# 两个服务通过自定义网络通信

services:
  # 一个 Web 服务（用 nginx 代替）
  web:
    image: nginx:alpine
    container_name: net-web
    ports:
      - "8080:80"
    networks:
      - app-net

  # 一个 API 服务（用 python 简单 HTTP 服务器代替）
  api:
    image: python:3.12-alpine
    container_name: net-api
    # 启动一个简单的 HTTP 服务器，返回固定内容
    command: sh -c "echo 'API response from container' > /tmp/index.html && python -m http.server 9000 -d /tmp"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

# ===== 验证步骤 =====
# 1. docker-compose up -d
# 2. 从 web 容器内访问 api 容器：
#    docker exec net-web wget -qO- http://api:9000
#    → API response from container
#
# 关键点：web 容器内可以直接用 "api"（容器名）作为域名访问 api 容器
# 这就是自定义网络的 DNS 解析能力

server:
  port: 8080

spring:
  datasource:
    # 用 docker-compose 中的服务名作为 host
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:demo}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      # 同样用服务名作为 host
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

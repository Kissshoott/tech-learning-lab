# 告警规则配置文件
# 学习 M4 时在 prometheus.yml 中取消 rule_files 的注释

# ⚠️ 测试环境配置：for 持续时间调短方便验证，生产环境建议 1m-5m
groups:
  - name: node_alerts
    rules:
      # 实例宕机告警
      - alert: InstanceDown
        expr: up == 0
        for: 10s            # 测试 10s，生产建议 1m-5m
        labels:
          severity: critical
        annotations:
          summary: "实例宕机"
          description: "实例 {{ $labels.instance }} 已停止响应超过 10 秒"

      # CPU 使用率过高告警
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 80
        for: 30s            # 测试 30s，生产建议 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU 使用率过高"
          description: "实例 {{ $labels.instance }} CPU 使用率 {{ $value }}%"

      # 内存使用率过高告警
      - alert: HighMemoryUsage
        expr: (1 - node_memory_available_bytes / node_memory_total_bytes) * 100 > 90
        for: 30s            # 测试 30s，生产建议 5m
        labels:
          severity: critical
        annotations:
          summary: "内存使用率过高"
          description: "实例 {{ $labels.instance }} 内存使用率 {{ $value }}%"

  - name: prometheus_alerts
    rules:
      # Prometheus 自身告警
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 30s            # 测试 30s，生产建议 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus 配置加载失败"
          description: "Prometheus 最近一次配置加载失败"

  # M6：Spring Boot 应用告警（学习 M6 时生效）
  - name: spring_boot_alerts
    rules:
      # JVM 堆内存使用率 > 85%
      - alert: HighJVMHeapUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} * 100 > 85
        for: 30s            # 测试 30s，生产建议 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM 堆内存使用率过高"
          description: "应用 {{ $labels.application }} 堆内存使用率 {{ $value }}%"

      # HTTP 5xx 错误率 > 5%
      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[1m])) / sum(rate(http_server_requests_seconds_count[1m])) * 100 > 5
        for: 30s            # 测试 30s，生产建议 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 错误率过高"
          description: "应用 {{ $labels.application }} 5xx 错误率 {{ $value }}%"

      # HTTP 响应时间 P95 > 2s
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[1m])) by (le, application)) > 2
        for: 30s            # 测试 30s，生产建议 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 响应时间过长"
          description: "应用 {{ $labels.application }} P95 响应时间 {{ $value }}s"

      # 订单失败率 > 10%
      - alert: HighOrderFailureRate
        expr: rate(orders_failed_total[1m]) / rate(orders_total[1m]) * 100 > 10
        for: 30s            # 测试 30s，生产建议 5m
        labels:
          severity: critical
        annotations:
          summary: "订单失败率过高"
          description: "订单失败率 {{ $value }}%"

      # JVM Full GC 频率过高
      - alert: HighFullGC
        expr: rate(jvm_gc_pause_seconds_count{action="end of major GC"}[1m]) > 0.1
        for: 30s            # 测试 30s，生产建议 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM Full GC 频率过高"
          description: "应用 {{ $labels.application }} Full GC 频率 {{ $value }}/s"

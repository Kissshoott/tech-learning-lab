server:
  port: 8080

spring:
  application:
    name: order-service
  profiles:
    active: dev

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${spring.profiles.active}
    export:
      prometheus:
        enabled: true
        step: 10s

# 日志配置
logging:
  level:
    root: INFO
    com.example: DEBUG

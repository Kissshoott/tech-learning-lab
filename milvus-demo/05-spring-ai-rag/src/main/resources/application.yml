server:
  port: 8080

spring:
  ai:
    vectorstore:
      milvus:
        client:
          host: localhost
          port: 19530
        collection-name: spring_ai_rag
        embedding-dimension: 2048
        initialize-schema: true
    openai:
      # 智谱AI API Key，申请地址：https://open.bigmodel.cn/
      # 启动前设置环境变量：set OPENAI_API_KEY=你的apikey（Windows）或 export OPENAI_API_KEY=你的apikey（Linux/macOS）
      api-key: ${OPENAI_API_KEY}
      base-url: https://open.bigmodel.cn/api/paas/v4
      embedding:
        options:
          model: embedding-3

logging:
  level:
    com.example.rag: DEBUG
